<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Smart Income & Expense Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem 1rem; display: flex; justify-content: center; min-height: 100vh; }

    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1.25rem; }
    
    h1 { 
      text-align: center; 
      font-size: 1.6rem; 
      font-weight: 800; 
      background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .card { 
      background: var(--card-bg); 
      padding: 1.25rem; 
      border-radius: 18px; 
      border: 1px solid var(--border); 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    
    label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; margin-bottom: 0.5rem; }
    
    input, select { 
      width: 100%; 
      padding: 0.85rem 1rem; 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      font-size: 1rem; 
      outline: none; 
      background: #0f172a; 
      color: #fff;
      transition: all 0.2s ease;
    }
    input:focus, select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    
    .summary-card { 
      background: var(--card-bg); 
      padding: 1.1rem; 
      border-radius: 18px; 
      border: 1px solid var(--border); 
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
    }
    .summary-card.inc::before { background: var(--green); }
    .summary-card.exp::before { background: var(--red); }
    .summary-card.net::before { background: linear-gradient(90deg, #8b5cf6, #ec4899); }

    .summary-card.net { grid-column: span 2; }
    
    .val { font-size: 1.35rem; font-weight: 800; margin-top: 0.3rem; }
    .val.green { color: var(--green); }
    .val.red { color: var(--red); }
    .val.purple { color: #c084fc; }

    .form-col { display: flex; flex-direction: column; gap: 0.85rem; }
    .form-row { display: flex; gap: 0.6rem; }
    .form-row input[type="text"] { flex: 2; }
    .form-row input[type="number"] { flex: 1; }
    
    button { 
      background: linear-gradient(135deg, var(--purple), var(--pink)); 
      color: white; 
      border: none; 
      padding: 0.95rem; 
      border-radius: 12px; 
      font-size: 1rem; 
      cursor: pointer; 
      font-weight: 700; 
      transition: transform 0.1s ease, opacity 0.2s;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
    }
    button:active { transform: scale(0.98); opacity: 0.9; }

    .expense-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; margin-top: 0.5rem; }
    .expense-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.85rem 1rem; 
      background: #0f172a; 
      border-radius: 14px; 
      border: 1px solid var(--border); 
    }
    .expense-info { display: flex; flex-direction: column; gap: 0.15rem; }
    
    .expense-cat { 
      font-size: 0.7rem; 
      color: #38bdf8; 
      background: rgba(56, 189, 248, 0.1); 
      padding: 0.15rem 0.5rem; 
      border-radius: 6px; 
      width: fit-content; 
      font-weight: 700; 
      text-transform: uppercase; 
    }
    
    .delete-btn { 
      background: rgba(239, 68, 68, 0.15); 
      color: var(--red); 
      border: none; 
      border-radius: 8px; 
      font-size: 1rem; 
      cursor: pointer; 
      padding: 0.3rem 0.6rem; 
      margin-left: 0.5rem;
      box-shadow: none;
    }
    .delete-btn:hover { background: var(--red); color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Monthly Budget Tracker</h1>

    <!-- Currency Selector -->
    <div class="card">
      <label for="currency">Select Currency</label>
      <select id="currency">
        <option value="₦">Naira (₦)</option>
        <option value="$">US Dollar ($)</option>
      </select>
    </div>

    <!-- Income Input Card -->
    <div class="card">
      <label for="main-income" id="income-label">Main Monthly Income</label>
      <input type="number" id="main-income" placeholder="Enter monthly income" min="0" step="0.01">
    </div>

    <!-- Summary Overview -->
    <div class="summary-grid">
      <div class="summary-card inc">
        <label>Main Income</label>
        <div class="val green" id="income-display">₦0.00</div>
      </div>
      <div class="summary-card exp">
        <label>Total Expenses</label>
        <div class="val red" id="total-expenses">₦0.00</div>
      </div>
      <div class="summary-card net">
        <label>Remaining Balance</label>
        <div class="val purple" id="net-balance">₦0.00</div>
      </div>
    </div>

    <!-- Add Expense Form -->
    <div class="card">
      <label>Add New Expense</label>
      <form id="expense-form" class="form-col">
        <div class="form-row">
          <input type="text" id="expense-title" placeholder="Description (e.g., Food, Rent)" required>
          <input type="number" id="expense-amount" placeholder="Amount" min="0" step="0.01" required>
        </div>
        <select id="expense-category">
          <option value="General">General</option>
          <option value="Housing & Rent">Housing & Rent</option>
          <option value="Food & Groceries">Food & Groceries</option>
          <option value="Transport & Fuel">Transport & Fuel</option>
          <option value="Utilities & Bills">Utilities & Bills</option>
          <option value="Entertainment">Entertainment</option>
        </select>
        <button type="submit">+ Add Expense</button>
      </form>
    </div>

    <!-- Expense History List -->
    <div class="card">
      <label>Expense History</label>
      <ul class="expense-list" id="expense-list"></ul>
    </div>
  </div>

  <script>
    let currencySymbol = localStorage.getItem('user_currency') || '₦';
    let income = parseFloat(localStorage.getItem('user_income')) || 500000;
    let expenses = JSON.parse(localStorage.getItem('user_expenses')) || [
      { id: Date.now(), title: "Apartment Rent", amount: 150000, category: "Housing & Rent" },
      { id: Date.now() + 1, title: "Supermarket", amount: 35000, category: "Food & Groceries" }
    ];

    const currencySelect = document.getElementById('currency');
    const incomeInput = document.getElementById('main-income');
    const incomeLabel = document.getElementById('income-label');
    const incomeDisplay = document.getElementById('income-display');
    const totalExpensesDisplay = document.getElementById('total-expenses');
    const netBalanceDisplay = document.getElementById('net-balance');
    const expenseForm = document.getElementById('expense-form');
    const expenseTitle = document.getElementById('expense-title');
    const expenseAmount = document.getElementById('expense-amount');
    const expenseCategory = document.getElementById('expense-category');
    const expenseList = document.getElementById('expense-list');

    currencySelect.value = currencySymbol;
    incomeInput.value = income;

    function saveData() {
      localStorage.setItem('user_currency', currencySymbol);
      localStorage.setItem('user_income', income);
      localStorage.setItem('user_expenses', JSON.stringify(expenses));
    }

    function formatMoney(amount) {
      return currencySymbol + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function updateTracker() {
      currencySymbol = currencySelect.value;
      income = parseFloat(incomeInput.value) || 0;
      
      const totalExpenses = expenses.reduce((sum, item) => sum + item.amount, 0);
      const netBalance = income - totalExpenses;

      incomeLabel.textContent = `Main Monthly Income (${currencySymbol})`;
      incomeDisplay.textContent = formatMoney(income);
      totalExpensesDisplay.textContent = formatMoney(totalExpenses);
      netBalanceDisplay.textContent = formatMoney(netBalance);

      if (netBalance < 0) {
        netBalanceDisplay.className = "val red";
      } else {
        netBalanceDisplay.className = "val purple";
      }

      saveData();
      renderExpenses();
    }

    function renderExpenses() {
      expenseList.innerHTML = '';

      if (expenses.length === 0) {
        expenseList.innerHTML = '<li style="color: var(--muted); text-align: center; padding: 0.75rem; font-size: 0.9rem;">No expenses added yet.</li>';
        return;
      }

      expenses.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'expense-item';
        li.innerHTML = `
          <div class="expense-info">
            <strong>${item.title}</strong>
            <span class="expense-cat">${item.category}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="color: var(--red); font-weight: 700;">-${formatMoney(item.amount)}</span>
            <button class="delete-btn" onclick="deleteExpense(${item.id})">✕</button>
          </div>
        `;
        expenseList.appendChild(li);
      });
    }

    expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const title = expenseTitle.value.trim();
      const amount = parseFloat(expenseAmount.value);
      const category = expenseCategory.value;

      if (title && !isNaN(amount)) {
        expenses.unshift({ id: Date.now(), title, amount, category });
        expenseTitle.value = '';
        expenseAmount.value = '';
        updateTracker();
      }
    });

    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      updateTracker();
    }

    currencySelect.addEventListener('change', updateTracker);
    incomeInput.addEventListener('input', updateTracker);

    updateTracker();
  </script>
</body>
</html>
